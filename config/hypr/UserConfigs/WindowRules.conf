# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi

# windowrule = match:class ^(GeForceNOW)$, tag +gfn
# windowrule = match:initial_class ^(GeForceNOW)$, tag +gfn
# windowrule = match:tag gfn, float 1
# windowrule = match:tag gfn, center 1

windowrule {
  name = GeForceNOW
  match:class = ^(GeForceNOW)$
  match:initial_class = ^(GeForceNOW)$
  float = 1
  center = 1
  size = 1920 1080
}

windowrule {
  name = spotify
  match:class = ^(spotify)$
  opacity = 0.9 0.7
}

layerrule {
    name = hyprshot-layerrule
    match:namespace = hyprpicker # name of the layer
    no_anim = on 
}

