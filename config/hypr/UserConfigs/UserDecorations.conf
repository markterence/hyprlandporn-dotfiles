# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 0
  gaps_in = 2
  gaps_out = 4

  col.active_border = $color12
  col.inactive_border = $color10
}

decoration {
  rounding = 10
  
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.1

  shadow {
    enabled = true
    range = 2 # old 2
    render_power = 1 # old 1
    offset = 0 0
    # color =  rgb(000000)
    color = $color0
    # color_inactive = $color10
    color_inactive = $color0
    # scale = 0.8
  }

  blur {
    enabled = true
    size = 12 #old 6
    passes = 3 #old 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
